name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux build, tests, and SPARK proofs
    runs-on: ubuntu-latest
    steps:
      - name: Check out database
        uses: actions/checkout@v7
        with:
          path: database
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: database
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Install GNATprove and GNATdoc
        # gnatprove (SPARK proofs) and gnatdoc (check_all runs it) are regular Alire
        # crates, not toolchain components; apt has no reliable packages.
        run: |
          alr install gnatprove
          alr install gnatdoc
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"
      - name: Build cryptolib sibling
        # Generates cryptolib's gitignored config so database.gpr's with resolves.
        working-directory: cryptolib
        run: alr --non-interactive build
      - name: Build database
        # Generates config/database_config.gpr, which database.gpr and the SPARK
        # projects with.
        working-directory: database
        run: alr --non-interactive build
      - name: Build project_tools sibling
        # tools/tools.gpr withs ../../project_tools/project_tools.gpr, which withs its
        # gitignored config/project_tools_config.gpr. database does not pin project_tools,
        # so "Build database" never generates it; build project_tools here so the raw
        # gprbuild of tools.gpr below can resolve the with.
        working-directory: project_tools
        run: alr --non-interactive build
      - name: Build the check_all validator
        working-directory: database/tools
        run: alr --non-interactive build
      - name: Generate tests config
        # tests/ is its own Alire root. check_all builds it with a raw
        # `alr exec -- gprbuild -P tests.gpr`, which does not generate the gitignored
        # tests/config/tests_config.gpr that tests.gpr withs; alr build here does.
        working-directory: database/tests
        run: alr --non-interactive build
      - name: Run check_all
        # Build, AUnit tests, database_inspect smokes, examples, GNATdoc, and the
        # 13 SPARK proofs (a real gate: --checks-as-errors=on).
        working-directory: database
        run: ./tools/bin/check_all

  concurrency-baseline:
    name: Concurrent multi-database (soak + ThreadSanitizer)
    # Gate for docs/concurrency-multidb-plan.md. Phases 1-2 landed, so the
    # deterministic functional isolation soak now blocks the build. The
    # ThreadSanitizer step needs ASLR disabled (setarch -R), which some runners
    # restrict, so it is allowed to fail as an environment guard -- TSan is
    # verified clean locally.
    runs-on: ubuntu-latest
    steps:
      - name: Check out database
        uses: actions/checkout@v7
        with:
          path: database
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: database
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Build cryptolib sibling
        working-directory: cryptolib
        run: alr --non-interactive build
      - name: Build database
        working-directory: database
        run: alr --non-interactive build
      - name: Build tests (generates tests config)
        working-directory: database/tests
        run: alr --non-interactive build
      - name: Functional soak (multi-database isolation)
        working-directory: database/tests
        run: ./bin/concurrency_soak 8
      - name: ThreadSanitizer soak
        # -R disables ASLR, which ThreadSanitizer requires. exitcode=66 makes any
        # reported race fail the step. Allowed to fail on runners that restrict
        # ASLR; the race check is the point, not a hard gate on such runners.
        continue-on-error: true
        working-directory: database/tests
        run: |
          alr exec -- gprbuild -P tests.gpr -XSANITIZE=thread
          TSAN_OPTIONS="halt_on_error=0 exitcode=66" setarch "$(uname -m)" -R ./bin/concurrency_soak 2
