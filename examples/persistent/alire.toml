name = "database_example_persistent"
description = "The persistent worked example for the database crate"
version = "0.14.0"
licenses = "MIT"
authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
website = "https://github.com/bracke/database"
tags = ["database", "example", "ada"]
project-files = ["persistent.gpr"]

executables = ["main"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
database = "*"

[[pins]]
database = { path = "../.." }

# database depends on cryptolib, but Alire honours pins only in the root crate,
# so every root that builds database must pin it too.
[[pins]]
cryptolib = { path = "../../../cryptolib" }

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so this root and the parent share database object files rather
# than forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
